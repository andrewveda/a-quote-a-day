<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Quote A Day</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background:
                radial-gradient(circle at top left, #3b1d6e, transparent 35%),
                radial-gradient(circle at bottom right, #0f766e, transparent 35%),
                #09090f;
            color: white;
        }

        .container {
            width: 100%;
            max-width: 750px;
            text-align: center;
        }

        .logo {
            font-size: 18px;
            letter-spacing: 4px;
            color: #a78bfa;
            margin-bottom: 18px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 35px;
            background: linear-gradient(90deg, #ffffff, #a78bfa, #67e8f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .quote-card {
            padding: 50px 40px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
        }

        .quote-mark {
            font-size: 70px;
            color: #a78bfa;
            line-height: 0.5;
            margin-bottom: 20px;
        }

        #quote {
            font-size: 28px;
            line-height: 1.6;
            font-weight: 500;
            margin-bottom: 25px;
        }

        #author {
            color: #c4b5fd;
            font-size: 17px;
            margin-bottom: 35px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 14px 25px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .new-btn {
            background: linear-gradient(135deg, #8b5cf6, #06b6d4);
            color: white;
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.12);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        button:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.35);
        }
